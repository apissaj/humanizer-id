name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test tools
        run: |
          python -m pip install --upgrade pip
          pip install pytest build

      - name: Run Full Test Suite (pytest)
        run: |
          pytest tests/

      - name: Verify CLI Demo
        run: |
          python scripts/audit.py --demo

      - name: Test Wheel Build & Packaging Integrity
        run: |
          python -m build
          pip install dist/*.whl
          python -c "from humanizer_id import audit_text; from humanizer_id.audit import load_default_data; k, g = load_default_data(); assert len(k['kategori']) > 0; print('Packaging verified successfully!')"
